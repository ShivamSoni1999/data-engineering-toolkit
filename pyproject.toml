[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-engineering-toolkit"
version = "0.1.0"
description = "Reusable building blocks for reliable metadata-driven data pipelines."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Shivam Soni"}]
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5"]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
